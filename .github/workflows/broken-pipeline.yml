name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Test and Deploy Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Java 17 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Khac phuc Loi 1: Cap quyen thuc thi cho Gradle Wrapper truoc khi chay test
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run automated tests with Gradle
        run: ./gradlew test

      - name: Build application JAR package
        run: ./gradlew bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Khac phuc Loi 2: Sua dung ten bien Secret REGISTRY_TOKEN (hoac fallback GITHUB_TOKEN)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Khac phuc Loi 3: Cau hinh context: . va file: ./Dockerfile dung thu muc lam viec
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/ptitvn/it-209-devops-session12-bai5:latest
